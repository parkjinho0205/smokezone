  <aside class="left">
    <ul class="lmenu">
      <li><a href="/My_박진호_smoke_zone/notiec/notice_list.html">Notice</a></li>

    <div class="adbox"><span>AD</span>광고</div>
  </aside>
  <!-- ===== common_list 끝 ===== -->

  <!-- ===== 글 수정 ===== -->
  <main class="content">
    <div class="head">
      <h2>News 수정</h2>
    </div>

    <form name="news">
      <input type="hidden" name="t_no" value="10">
      <table class="writeForm">
        <colgroup>
          <col width="15%">
          <col width="45%">
          <col width="15%">
          <col width="25%">
        </colgroup>
        <tbody>
          <tr>
            <th>제목</th>
            <td colspan="3">흡연구역 MAP 서비스 오픈 안내</td>
          </tr>
          <tr>
            <th>작성자</th>
            <td>관리자</td>
            <th>작성일</th>
            <td>2026-11-11 14:30</td>
          </tr>
          <tr>
            <th>내용</th>
            <td colspan="3">
            <textarea name="t_content" class="inContent">안녕하세요. 흡연구역 MAP입니다.

새로운 흡연구역은 제보 게시판에서 알려 주시면 확인 후 지도에 반영하겠습니다.
감사합니다.
			</textarea>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="writeBtns">
        <a href="javascript:goUpdate()" class="btnSave">수정</a>
        <a href="news_view.html" class="btnCancel">취소</a>
      </div>
    </form>
  </main>
</div>
