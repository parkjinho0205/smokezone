<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흡연구역 MAP - news 글쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link href="../css/sub_c.css" rel="stylesheet">
<script src="../js/common.js"></script>
<script>
	function goSave(){
		if(isEmpty(news.t_title, "제목을 입력하세요."))return;
		if(isEmpty(news.t_content, "내용을 입력하세요."))return;
		
		// DB 연동할 때 아래 3줄 사용
		// news.method = "post";
		// news.action = "Notice?t_gubun=save";
		// news.submit();
		alert("저장 (DB 연동 전 화면 확인용)");
	}
</script>
</head>
<body>

<!-- ===== common_header (common_header.jsp 로 분리) ===== -->
<script src="../js/include.js"></script>
	<div data-include="../common_header.html"></div>
<!-- 여기까지 header -->

<div class="wrap">

  <!-- ===== common_list 시작 ===== -->
  <aside class="left">
    <ul class="lmenu">
      <li><a href="/My_박진호_smoke_zone/notice/notice_list.html">Notice</a></li>
      <li><a href="/My_박진호_smoke_zone/news/news_list.html" class="on">News</a></li>
    </ul>
    <div class="adbox"><span>AD</span>광고</div>
  </aside>
  <!-- ===== common_list 끝 ===== -->

  <!-- ===== 글쓰기 ===== -->
  <main class="content">
    <div class="head">
      <h2>News 글쓰기</h2>
    </div>

    <form name="news">
      <table class="writeForm">
        <colgroup>
          <col width="15%">
          <col width="85%">
        </colgroup>
        <tbody>
          <tr>
            <th>제목</th>
            <td><input type="text" name="t_title" class="inTitle" maxlength="100" placeholder="제목을 입력하세요"></td>
          </tr>
          <tr>
            <th>내용</th>
            <td><textarea name="t_content" class="inContent" placeholder="내용을 입력하세요"></textarea></td>
          </tr>
          <tr>
            <th>작성자</th>
            <td>관리자</td>
          </tr>
        </tbody>
      </table>

      <div class="writeBtns">
        <a href="javascript:goSave()" class="btnSave">저장</a>
        <a href="news_list.html" class="btnCancel">목록</a>
      </div>
    </form>
  </main>
</div>

<!-- ===== common_footer (common_footer.jsp 로 분리) ===== -->
<footer class="foot">
  <div data-include="../common_footer.html"></div>
</footer>

</body>
</html>
