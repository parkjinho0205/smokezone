<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흡연구역 MAP - Notice 수정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link href="../css/sub_c.css" rel="stylesheet">
<script src="../js/common.js"></script>
<script>
	function goUpdate(){
		if(isEmpty(notice.t_content, "내용을 입력하세요."))return;

		// DB 연동할 때 아래 3줄 사용
		// notice.method = "post";
		// notice.action = "Notice?t_gubun=update";
		// notice.submit();
		alert("수정 (DB 연동 전 화면 확인용)");
	}

	// 기존 첨부파일 삭제에 체크하면 새 파일 선택을 막고, 체크를 풀면 다시 선택 가능
	function fileDelCheck(){
		if(notice.t_file_del.checked){
			notice.t_file.value = "";
			notice.t_file.disabled = true;
		}else{
			notice.t_file.disabled = false;
		}
	}
</script>
</head>
<body>

<!-- ===== common_header (common_header.jsp 로 분리) ===== -->
<script src="../js/include.js"></script>
	<div data-include="../common_header.html"></div>
<!-- 여기까지 header -->

<div class="wrap">

  <!-- ===== common_list 시작 ===== -->
  <aside class="left">
    <ul class="lmenu">
      <li><a href="/My_박진호_smoke_zone/notiec/notice_list.html" class="on">Notice</a></li>
      <li><a href="/My_박진호_smoke_zone/news/news_list.html">News</a></li>
    </ul>
    <div class="adbox"><span>AD</span>광고</div>
  </aside>
  <!-- ===== common_list 끝 ===== -->

  <!-- ===== 글 수정 ===== -->
  <main class="content">
    <div class="head">
      <h2>Notice 수정</h2>
    </div>

    <form name="notice" enctype="multipart/form-data">
      <input type="hidden" name="t_no" value="10">
      <input type="hidden" name="t_file_old" value="notice_sample.pdf">

      <table class="writeForm">
        <colgroup>
          <col width="15%">
          <col width="45%">
          <col width="15%">
          <col width="25%">
        </colgroup>
        <tbody>
          <tr>
            <th>제목</th>
            <td colspan="3">흡연구역 MAP 서비스 오픈 안내</td>
          </tr>
          <tr>
            <th>작성자</th>
            <td>관리자</td>
            <th>작성일</th>
            <td>2026-11-11 14:30</td>
          </tr>
          <tr>
            <th>내용</th>
            <td colspan="3">
            <textarea name="t_content" class="inContent">안녕하세요. 흡연구역 MAP입니다.
전국의 흡연구역을 지도에서 쉽게 찾고, 후기와 평점을 확인할 수 있는 서비스를 오픈했습니다.
새로운 흡연구역은 제보 게시판에서 알려 주시면 확인 후 지도에 반영하겠습니다.
감사합니다.
			</textarea>
            </td>
          </tr>

          <!-- 첨부파일이 있는 글: 기존 파일 삭제 또는 새 파일로 변경 -->
          <tr>
            <th rowspan="2">첨부파일</th>
            <td colspan="3">
              <span class="fileNow"><span class="fileIcon"></span>notice_sample.pdf</span>
              <label class="fileDel"><input type="checkbox" name="t_file_del" value="Y" onclick="fileDelCheck()">삭제</label>
            </td>
          </tr>
          <tr>
            <td colspan="3">
              <input type="file" name="t_file">
              <span class="fileHint">새 파일을 선택하면 기존 파일이 교체됩니다.</span>
            </td>
          </tr>

          <!-- 첨부파일이 없는 글은 위 tr 2개 대신 아래 tr 사용
          <tr>
            <th>첨부파일</th>
            <td colspan="3">
              <input type="file" name="t_file">
              <span class="fileHint">첨부된 파일이 없습니다. 파일을 선택하면 추가됩니다.</span>
            </td>
          </tr>
          -->
        </tbody>
      </table>

      <div class="writeBtns">
        <a href="javascript:goUpdate()" class="btnSave">수정</a>
        <a href="notice_view.html" class="btnCancel">취소</a>
      </div>
    </form>
  </main>
</div>

<!-- ===== common_footer (common_footer.jsp 로 분리) ===== -->
<footer class="foot">
  <div data-include="../common_footer.html"></div>
</footer>


</body>
</html>
